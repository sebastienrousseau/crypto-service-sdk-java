# Local toolchain: JDK 21 runs the build, which targets Java 17
# (maven.compiler.release). The exact Temurin build CI and the release
# workflow use, so a local build gives the same jar bytes
# (docs/REPRODUCING.md). Maven itself comes from ./mvnw. Node and pnpm
# build the pinned crypto-server for `make regression`.
[tools]
java = "temurin-21.0.13+9"
node = "24"
pnpm = "11.9.0"
