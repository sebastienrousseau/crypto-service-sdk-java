# SPDX-License-Identifier: Apache-2.0 OR MIT
#
# Lint, build, unit tests and the 100 % coverage gate on Java 17 and 21;
# the benchmark smoke run; the API breakage check; then the conformance
# job: it checks out sebastienrousseau/crypto-service at the commit in
# ci/server.ref, builds it with Node 24 and pnpm 11.9.0, and runs
# scripts/regression.sh (the same as `make regression`), which starts
# node packages/crypto-server/dist/index.js on loopback with a random
# CRYPTO_API_KEY and JWT_SECRET, waits for /health, and runs every gate,
# the conformance kit, every example, every README snippet and the
# benchmark smoke run. Maven comes from ./mvnw (SHA-256 checked) and
# every artifact it resolves must match .mvn/checksums/.
name: CI

on:
  push:
    branches: [main, "feat/*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Every file states the same version
        run: scripts/verify-release-versions

      - name: Whitespace format, line length and file size
        run: make format-check size

      - name: javac -Xlint:all -Werror and PMD complexity ceilings
        run: make lint

  test:
    name: Build, unit tests and coverage (Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        java: ["17", "21"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Every local gate (JaCoCo fails below 100 % line and branch)
        run: make check

      - name: Coverage report
        if: always() && matrix.java == '21'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jacoco-report
          path: target/site/jacoco/
          if-no-files-found: ignore
          retention-days: 7

  bench:
    name: Benchmarks smoke run (client-side)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Every client-side scenario briefly (not asserted)
        run: make bench-smoke

  api:
    name: API breakage against the last release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"

      # japicmp against the latest co.cryptoservice:crypto-service-sdk on
      # Maven Central. Until the first release is published there is
      # nothing to compare with, and `make api-check` says so and passes.
      - name: japicmp
        run: make api-check

  conformance:
    name: Conformance against crypto-server
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: The pinned crypto-service commit
        id: ref
        run: echo "sha=$(tr -d '[:space:]' < ci/server.ref)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: sebastienrousseau/crypto-service
          ref: ${{ steps.ref.outputs.sha }}
          path: crypto-service
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.9.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Build crypto-server
        working-directory: crypto-service
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm -r run build

      - name: Gate, conformance kit (none skipped), examples, README snippets, benchmark smoke
        env:
          CRYPTO_SERVER_DIR: ${{ github.workspace }}/crypto-service
        run: make regression
